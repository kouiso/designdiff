<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 400px;
    height: 300px;
    overflow: hidden;
  }
  body {
    font-family: "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #f4f6fb 0%, #dfe7f5 100%);
  }
  .card {
    margin: 20px;
    width: 360px;
    height: 200px;
    border-radius: 18px;
    background: #ffffff;
    border: 1px solid #c7d2e3;
    box-shadow: 0 6px 14px rgba(30, 41, 82, 0.18);
    padding: 24px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 700;
    color: #1e2952;
    letter-spacing: 0.02em;
  }
  p {
    margin: 0 0 14px;
    font-size: 13px;
    line-height: 1.6;
    color: #4a5578;
  }
  .badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, #5b7cfa 0%, #8f6bf5 100%);
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
  }
  .row {
    margin-top: 14px;
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #5b7cfa;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>校正用フィクスチャ</h1>
    <p>実画面レンダリングの雑音を測るための固定HTML。文字のふち・角丸・グラデーションでアンチエイリアス差を作る。</p>
    <span class="badge">calibration</span>
    <div class="row">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
