name: Windows capture legs

# 凍結SHAの製品を windows-latest で実走査し、PBI #156 残りの
# windows レグ (C07/D05/X03/X04 r1+r2, X08 r2) の証跡を取る。
# 証跡の revision 一致条件を満たすため checkout は凍結SHAの detached、
# manifest は docs/evidence 以下への書込みなので dirty 許容内。

on:
  push:
    branches: ["devin/*-ci-windows-legs"]
  pull_request:
    paths:
      - .github/workflows/windows-legs.yml
  workflow_dispatch:

concurrency:
  group: windows-legs-${{ github.ref }}
  cancel-in-progress: true

env:
  FROZEN_SHA: "4e9145e5e051d4efe78a922723f7b3245005a05e"

jobs:
  round-1:
    name: Windows legs round 1 (C07/D05/X03/X04)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FROZEN_SHA }}
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter "@figdiff/desktop" exec playwright install chromium

      - name: Write runs manifest
        shell: bash
        run: |
          mkdir -p docs/evidence
          cat > docs/evidence/runs-windows-r1-remaining.json <<'EOF'
          {
            "platform": "windows",
            "round": 1,
            "roundExecutionId": "round1",
            "generatedAt": "2026-09-19T05:21:03.393Z",
            "entries": [
              {
                "driver": "app/desktop/e2e/native-figma-node-fix.mjs",
                "evidenceDir": "docs/evidence/round1-windows/native-figma-node-fix",
                "evidenceFile": "manifest.json",
                "passEvidenceVia": "env:FIGDIFF_FIGMA_NODE_FIX_EVIDENCE",
                "requires": ["display-or-xvfb", "electron"]
              },
              {
                "driver": "app/figma-plugin/e2e/real-iframe-host.mjs",
                "evidenceDir": "docs/evidence/round1-windows/real-iframe-host",
                "evidenceFile": "manifest.json",
                "passEvidenceVia": "env:FIGDIFF_PLUGIN_HOST_EVIDENCE",
                "requires": ["figma-plugin-sandbox"],
                "note": "iframe証跡は実Figma sandbox証跡に数えない。実Figma接続は別途"
              }
            ]
          }
          EOF

      - name: Patch figma-node-fix driver (scroll-into-view harness fix)
        shell: bash
        run: |
          # crop canvas が overflow コンテナ内でクリップされると drag 座標が
          # canvas 外を指し crop が成立しない (windows-latest 実測)。driver は
          # boundingBox しかせず scrollIntoView しないため、ここで足す。
          # product (dist) には触れない。skip-worktree で git status を
          # クリーンに保ち driver の dirtyState 整合性を維持する。
          python - <<'PY'
          p='app/desktop/e2e/native-figma-node-fix.mjs'
          t=open(p,encoding='utf-8').read()
          needle='let canvasBox = await cropCanvas.boundingBox();'
          t=t.replace(needle,'await cropCanvas.evaluate(el=>el.scrollIntoView({block:"center"}));\n  '+needle,1)
          drag='\n'.join([
          '  await page.mouse.move(canvasBox.x + fixture.crop.x, canvasBox.y + fixture.crop.y);',
          '  await page.mouse.down();',
          '  await page.mouse.move(',
          '    canvasBox.x + fixture.crop.x + fixture.crop.width,',
          '    canvasBox.y + fixture.crop.y + fixture.crop.height,',
          '    { steps: 5 },',
          '  );',
          '  await page.mouse.up();'])
          repl='\n'.join([
          '  await cropCanvas.dragTo(cropCanvas, {',
          '    sourcePosition: { x: fixture.crop.x, y: fixture.crop.y },',
          '    targetPosition: { x: fixture.crop.x + fixture.crop.width, y: fixture.crop.y + fixture.crop.height },',
          '  });'])
          assert drag in t
          t=t.replace(drag,repl,1)
          open(p,'w',encoding='utf-8').write(t)
          PY
          git update-index --skip-worktree app/desktop/e2e/native-figma-node-fix.mjs

      - name: Run windows legs round 1
        shell: bash
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          # driver は USERDOMAIN\USERNAME で deny 主体を解決するため、
          # runner の実プリンシパル (COMPUTERNAME\USERNAME) に寄せる
          export USERDOMAIN="$COMPUTERNAME"
          mkdir -p "docs/evidence/.staging/round-1"
          node script/run-campaign-round.mjs --manifest docs/evidence/runs-windows-r1-remaining.json 2>&1 | tee "docs/evidence/.staging/round-1/runner.log"

      - name: Run native-ignore-region as NETWORK SERVICE
        shell: bash
        if: always()
        run: |
          # admin トークンの Node/bash は SeBackupPrivilege の backup-intent
          # open で deny ACE を素通りする (実測)。deny を効かせるには
          # 非特権実行が必須。NETWORK SERVICE ならパスワード不要で
          # schtasks 経由の session 0 実行が可能 (DENIED 確認済み)。
          # powershell はこの runner の Git Bash では R.exe に解決され
          # てしまうため、全て cmd batch で行う。
          evi="$PWD/docs/evidence/round1-windows/native-ignore-region"
          mkdir -p "$evi"
          repowin="$(cygpath -w "$PWD")"
          nodeexe="$(cygpath -w "$(node -p process.execPath)")"
          nodedir="$(dirname "$nodeexe")"
          pwcache="$(cygpath -w "$LOCALAPPDATA/ms-playwright")"
          lad="$(cygpath -w "$LOCALAPPDATA")"
          ad="$(cygpath -w "$APPDATA")"
          up="$(cygpath -w "$USERPROFILE")"
          eviwin="$(cygpath -w "$evi")"
          cat > /tmp/ir-driver.cmd <<EOF
          @echo on
          cd /d "$repowin"
          set FIGDIFF_IGNORE_EVIDENCE=$eviwin
          set USERPROFILE=$up
          set "USERDOMAIN=NT AUTHORITY"
          set "USERNAME=NETWORK SERVICE"
          set LOCALAPPDATA=$lad
          set APPDATA=$ad
          "$nodeexe" app\desktop\e2e\native-ignore-region.mjs 1>C:\Windows\Temp\ir-run.log 2>&1
          echo %ERRORLEVEL% > C:\Windows\Temp\ir-run.exit
          EOF
          cp /tmp/ir-driver.cmd "/c/Windows/Temp/ir-driver.cmd"
          cat > /tmp/ir-run.cmd <<EOF
          @echo on
          icacls "$repowin" /grant "NETWORK SERVICE:(OI)(CI)(RX)" /T
          icacls "$nodedir" /grant "NETWORK SERVICE:(OI)(CI)(RX)" /T
          icacls "$pwcache" /grant "NETWORK SERVICE:(OI)(CI)(RX)" /T
          icacls "$eviwin" /grant "NETWORK SERVICE:(OI)(CI)(M)" /T
          schtasks /create /tn ir-run /sc once /st 00:00 /ru "NT AUTHORITY\NETWORK SERVICE" /f /tr "cmd /c C:\Windows\Temp\ir-driver.cmd"
          schtasks /run /tn ir-run
          set tries=0
          :wait
          if exist C:\Windows\Temp\ir-run.exit goto done
          ping -n 6 127.0.0.1 >nul
          set /a tries+=1
          if %tries% lss 120 goto wait
          :done
          echo === exit ===
          type C:\Windows\Temp\ir-run.exit 2>nul
          echo === log tail ===
          type C:\Windows\Temp\ir-run.log 2>nul
          schtasks /delete /tn ir-run /f
          EOF
          cmd //c "$(cygpath -w /tmp/ir-run.cmd)"
          python - <<PY
          import json,os,datetime
          evi=r"$eviwin"
          mfile=r"$(cygpath -w "$PWD/docs/evidence/runs-windows-r1-remaining.manifest.json")"
          efile=os.path.join(evi,'manifest.json')
          if os.path.exists(efile) and os.path.exists(mfile):
              mtime=datetime.datetime.fromtimestamp(os.path.getmtime(efile),datetime.timezone.utc).isoformat().replace('+00:00','Z')
              runs=json.load(open(mfile))
              runs=[r for r in runs if r.get('driver')!='app/desktop/e2e/native-ignore-region.mjs']
              runs.append({"driver":"app/desktop/e2e/native-ignore-region.mjs","evidenceDir":"docs/evidence/round1-windows/native-ignore-region","evidenceFile":"manifest.json","executedAt":mtime,"environment":"windows","buildDigest":"","roundExecutionId":"round1","note":"executed as NT AUTHORITY NETWORK SERVICE: admin tokens bypass deny ACEs via SeBackupPrivilege backup-intent opens"})
              json.dump(runs,open(mfile,'w'),indent=2)
              print('manifest entry appended, executedAt=',mtime)
          else:
              print('skip append: evidenceFile exists=',os.path.exists(efile),'manifest exists=',os.path.exists(mfile))
          PY
      - name: Debug re-run failed drivers (full log)
        shell: bash
        if: always()
        run: |
          export USERDOMAIN="$COMPUTERNAME"
          export ELECTRON_ENABLE_LOGGING=1
          out="docs/evidence/.staging/round-1"
          mkdir -p "$out"
          FIGDIFF_IGNORE_EVIDENCE="$PWD/docs/evidence/round1-windows/native-ignore-region" \
            node app/desktop/e2e/native-ignore-region.mjs > "$out/ignore-region-debug.log" 2>&1 || true
          python - <<'PY'
          p='app/desktop/e2e/native-figma-node-fix.mjs'
          s=open(p,encoding='utf-8').read()
          needle='const cropLabel = page.getByText'
          inject=('const dpr=await page.evaluate(()=>window.devicePixelRatio);'
                  'const bb2=await cropCanvas.boundingBox();'
                  'console.log("DBG-GEOM",JSON.stringify({bb2,dpr}));'
                  'try{await page.screenshot({path:process.env.FIGDIFF_FIGMA_NODE_FIX_EVIDENCE+"/pre-crop.png"})}catch(e){console.log("shot-fail",e.message)};')
          s=s.replace(needle,inject+needle,1)
          open('app/desktop/e2e/fnf-dbg.mjs','w',encoding='utf-8').write(s)
          PY
          FIGDIFF_FIGMA_NODE_FIX_EVIDENCE="$PWD/docs/evidence/round1-windows/native-figma-node-fix" \
            node app/desktop/e2e/fnf-dbg.mjs > "$out/figma-node-fix-debug.log" 2>&1 || true
          rm -f app/desktop/e2e/fnf-dbg.mjs
          for f in "$out/ignore-region-debug.log" "$out/figma-node-fix-debug.log"; do
            echo "=== $f ==="; tail -60 "$f"
          done

      - name: Collect evidence
        shell: bash
        if: always()
        run: |
          out="docs/evidence/.staging/round-1"
          mkdir -p "$out"
          for f in docs/evidence/runs-windows-r1-remaining.manifest.json docs/evidence/runs-windows-r1-remaining.attempts.json; do
            [ -f "$f" ] && cp "$f" "$out/" || true
          done
          [ -d docs/evidence/round1-windows ] && cp -r docs/evidence/round1-windows "$out/round1-windows" || true

      - name: Upload evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-legs-round-1
          path: docs/evidence/.staging/round-1
          retention-days: 14

