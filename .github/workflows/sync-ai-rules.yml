name: AI Rules Drift Check

on:
  # No path filter: this job must report on every PR so it can be made a required check.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    name: Bridge files in sync with AGENTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check generated AI rule files are in sync
        run: bash script/sync-ai-rules.sh --check
