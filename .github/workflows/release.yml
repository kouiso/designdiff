name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS
            runs-on: ${{ vars.RUNNER_MACOS }}
          - os: Windows
            runs-on: windows-latest
          - os: Linux
            runs-on: ${{ vars.RUNNER_LINUX }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @figdiff/shared build

      - name: Build Electron app
        run: pnpm --filter @figdiff/desktop build

      - name: Package & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @figdiff/desktop exec electron-builder --publish always
