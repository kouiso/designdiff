name: Deploy Web

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-pages:
    name: Cloudflare Pages
    runs-on: ${{ vars.RUNNER_LINUX }}
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_PAGES_PROJECT_NAME != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Validate Cloudflare configuration
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          test -n "$ACCOUNT_ID"
          test -n "$API_TOKEN"
          test -n "$PROJECT_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @figdiff/shared build

      - name: Build web app
        run: pnpm --filter @figdiff/desktop build:web

      - name: Verify web build output
        run: test -f app/desktop/dist/web/index.html

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/desktop/dist/web --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}" --branch="${{ github.head_ref || github.ref_name }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm

      - name: Verify deployment URL
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          HTTP_STATUS="$(curl -fsSIL --retry 5 --retry-delay 5 -o /dev/null -w "%{http_code}" "$DEPLOYMENT_URL")"
          test "$HTTP_STATUS" = "200"

      - name: Skip deploy when Cloudflare configuration is unavailable
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: |
          echo "Cloudflare deploy skipped: set CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, and CLOUDFLARE_PAGES_PROJECT_NAME to enable deployment."
