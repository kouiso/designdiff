name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    runs-on: ${{ vars.RUNNER_LINUX }}
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?(!)?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -qE "$pattern"; then
            echo "PR title does not follow Conventional Commits:"
            echo "  '$PR_TITLE'"
            echo ""
            echo "Expected: type(scope?): description"
            echo "  e.g. 'feat(desktop): add overlay toggle'"
            echo "Allowed types: feat fix docs style refactor perf test build ci chore revert"
            exit 1
          fi
          echo "PR title OK: '$PR_TITLE'"
