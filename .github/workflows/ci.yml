name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (${{ matrix.check-type }})
    runs-on: ${{ vars.RUNNER_LINUX }}
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        check-type: [lint, typecheck, test, coverage]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Biome check (format + lint)
        if: matrix.check-type == 'lint'
        run: pnpm check

      - name: ESLint
        if: matrix.check-type == 'lint'
        run: pnpm lint:eslint

      - name: TypeScript typecheck
        if: matrix.check-type == 'typecheck'
        run: pnpm typecheck

      - name: Unit tests
        if: matrix.check-type == 'test'
        run: pnpm test

      - name: Coverage thresholds
        if: matrix.check-type == 'coverage'
        run: pnpm -r --filter "@figdiff/shared" --filter "@figdiff/mcp-server" --filter "@figdiff/desktop" run test:coverage

  e2e:
    name: E2E (Playwright)
    runs-on: ${{ vars.RUNNER_LINUX }}
    timeout-minutes: 20
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # ブラウザ本体はリポジトリに無いので、実行前に取ってくる必要がある。
      - name: Install Playwright browser
        run: pnpm --filter "@figdiff/desktop" exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm --filter "@figdiff/desktop" run e2e

      # 落ちたときに何が起きたかを後から見られるようにする。
      # 成果物の保存は失敗時だけにして、無料枠を無駄に減らさない。
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: app/desktop/playwright-report
          retention-days: 7

  naming:
    name: Naming (kebab-case files, singular folders)
    runs-on: ${{ vars.RUNNER_LINUX }}
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Check naming conventions
        run: node script/check-naming.mjs
