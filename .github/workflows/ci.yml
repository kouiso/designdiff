name: CI

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (${{ matrix.check-type }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        check-type: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @figdiff/shared build

      - name: Biome check (format + lint)
        if: matrix.check-type == 'lint'
        run: pnpm check

      - name: ESLint
        if: matrix.check-type == 'lint'
        run: pnpm lint:eslint

      - name: TypeScript typecheck
        if: matrix.check-type == 'typecheck'
        run: pnpm typecheck

      - name: Unit tests
        if: matrix.check-type == 'test'
        run: pnpm test
