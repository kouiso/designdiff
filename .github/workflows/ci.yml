name: CI

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  node:
    name: Node (${{ matrix.check-type }})
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        check-type: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @figdiff/shared build

      - name: Biome check (format + lint)
        if: matrix.check-type == 'lint'
        run: pnpm check

      - name: ESLint
        if: matrix.check-type == 'lint'
        run: pnpm lint:eslint

      - name: TypeScript typecheck
        if: matrix.check-type == 'typecheck'
        run: pnpm typecheck

      - name: Unit tests
        if: matrix.check-type == 'test'
        run: pnpm test

  rust:
    name: Rust (${{ matrix.check-type }})
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        check-type: [check, test, clippy]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cargo check
        if: matrix.check-type == 'check'
        working-directory: app/desktop/src-tauri
        run: cargo check

      - name: Cargo test
        if: matrix.check-type == 'test'
        working-directory: app/desktop/src-tauri
        run: cargo test

      - name: Cargo clippy
        if: matrix.check-type == 'clippy'
        working-directory: app/desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo fmt check
        if: matrix.check-type == 'clippy'
        working-directory: app/desktop/src-tauri
        run: cargo fmt -- --check
