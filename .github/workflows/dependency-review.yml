name: Dependency Review

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "**/package.json"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ${{ vars.RUNNER_LINUX }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: >-
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0-only,
            GPL-3.0-or-later,
            LGPL-2.0-only,
            LGPL-2.0-or-later,
            LGPL-3.0-only,
            LGPL-3.0-or-later,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            SSPL-1.0,
            CDDL-1.0,
            EPL-1.0
          comment-summary-in-pr: always
          warn-only: true
