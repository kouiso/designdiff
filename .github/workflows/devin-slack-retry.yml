# Devin 起動リクエストの定期リトライ（薄型 caller）。
# 実体は kouiso/ritmo-devin の reusable workflow（中央実装・MAX_TRIES=3）。
name: Devin Slack Retry

on:
  issues:
    types: [labeled]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  retry-devin:
    name: Retry pending Devin triggers
    uses: kouiso/ritmo-devin/.github/workflows/devin-slack-retry-reusable.yml@devin/1791769900-devin-slack-retry-reusable
    secrets: inherit
