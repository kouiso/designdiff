name: Build

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Electron Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
          - os: Windows
            runs-on: windows-latest
          - os: macOS
            runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    runs-on: ${{ matrix.runs-on }}
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @figdiff/shared build

      - name: Build Electron app
        run: pnpm --filter @figdiff/desktop build

      - name: Verify build output
        shell: bash
        run: |
          ls app/desktop/dist/main/
          ls app/desktop/dist/preload/
          ls app/desktop/dist/renderer/
