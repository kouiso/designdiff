name: License Check

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "**/package.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    name: License Check
    runs-on: ${{ vars.RUNNER_LINUX }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          # 旧識別子（GPL-2.0 等）と現行 SPDX 識別子（GPL-2.0-only / -or-later 等）の
          # 両方を含める。license-checker の --failOn は完全一致のため、削除した
          # dependency-review.yml の deny-licenses（現行識別子）をここに統合している。
          DISALLOW="GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;LGPL-2.0;LGPL-2.0-only;LGPL-2.0-or-later;LGPL-3.0;LGPL-3.0-only;LGPL-3.0-or-later;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;SSPL-1.0;CDDL-1.0;EPL-1.0"
          FAIL_ON=$(echo "$DISALLOW" | tr ';' ' ' | xargs -n1 echo "--failOn" | tr '\n' ' ')

          echo "## License Check Results" >> "$GITHUB_STEP_SUMMARY"

          license-checker --production --summary $FAIL_ON | tee license-summary.txt

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat license-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-report
          path: license-summary.txt
          retention-days: 30
