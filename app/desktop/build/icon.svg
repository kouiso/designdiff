  <circle cx="370" cy="176" r="14" fill="#EF4444"/>
  <rect x="362" y="173" width="16" height="6" rx="2" fill="white"/>

  <!-- Green diff mark (match) -->
  <circle cx="370" cy="220" r="14" fill="#22C55E"/>
  <path d="M362 220 L367 225 L378 214" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Vertical divider line in overlap area -->
  <line x1="256" y1="150" x2="256" y2="374" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="8,6" opacity="0.6"/>
